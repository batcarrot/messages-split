name: SplitMessages
options:
  bundleIdPrefix: com.batcarrot
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SplitCore:
    path: Packages/SplitCore

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"

targets:
  SplitMessages:
    type: application
    platform: iOS
    sources:
      - SplitMessages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batcarrot.messages-split
        INFOPLIST_FILE: SplitMessages/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: SplitMessages/SplitMessages.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    entitlements:
      path: SplitMessages/SplitMessages.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.batcarrot.messages-split
    dependencies:
      - target: MessagesExtension
      - package: SplitCore
    scheme:
      testTargets: []

  MessagesExtension:
    type: app-extension
    platform: iOS
    sources:
      - MessagesExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batcarrot.messages-split.MessagesExtension
        INFOPLIST_FILE: MessagesExtension/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: MessagesExtension/MessagesExtension.entitlements
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    entitlements:
      path: MessagesExtension/MessagesExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.batcarrot.messages-split
    dependencies:
      - package: SplitCore
      - sdk: Messages.framework
      - sdk: SwiftUI.framework

schemes:
  SplitMessages:
    build:
      targets:
        SplitMessages: all
        MessagesExtension: all
    run:
      config: Debug
