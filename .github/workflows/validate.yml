name: Validate split logic

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  python-split-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run balance engine tests
        run: python3 scripts/validate_split_logic.py -v
